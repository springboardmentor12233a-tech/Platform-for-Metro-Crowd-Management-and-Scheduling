<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MetroFlow - Authentication Portal</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <div class="auth-wrapper">
        <div class="auth-card">
            <div style="text-align: center; margin-bottom: 2rem;">
                <div class="brand-icon" style="width: 48px; height: 48px; font-size: 1.5rem; margin: 0 auto 0.75rem auto;">⚡</div>
                <h1 style="font-size: 1.75rem; font-weight: 800; background: var(--gradient-primary); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">MetroFlow</h1>
                <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 0.25rem;">AI Metro Crowd Management Platform</p>
            </div>

            <form id="login-form">
                <div class="form-group">
                    <label class="form-label" for="username">Username</label>
                    <input type="text" id="username" class="form-input" placeholder="admin or operator" required autocomplete="username">
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" id="password" class="form-input" placeholder="Enter password" required autocomplete="current-password">
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.85rem; margin-top: 0.5rem; font-size: 0.95rem;">
                    Sign In to Console ➔
                </button>
            </form>

            <div style="margin-top: 2rem; padding-top: 1.25rem; border-top: 1px solid var(--border-color); font-size: 0.82rem; color: var(--text-muted); text-align: center;">
                <p style="margin-bottom: 0.5rem;"><strong>Demo Credentials:</strong></p>
                <div style="display: flex; justify-content: space-around;">
                    <span>🛡️ Admin: <code>admin</code> / <code>admin123</code></span>
                    <span>🕹️ Operator: <code>operator</code> / <code>operator123</code></span>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/main.js"></script>
    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();
                if (res.ok) {
                    showToast(`Welcome back, ${data.user.full_name}!`, 'success');
                    setTimeout(() => window.location.href = '/index.html', 700);
                } else {
                    showToast(data.error || 'Login failed', 'error');
                }
            } catch (err) {
                showToast('Unable to connect to MetroFlow auth service.', 'error');
            }
        });
    </script>
</body>
</html>
