<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI MetroFlow - Authentication Portal</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <div class="auth-wrapper">
        <div class="auth-card">
            <!-- Professional AI MetroFlow Logo & Header -->
            <div style="text-align: center; margin-bottom: 2.25rem;">
                <div class="brand-logo-icon" style="width: 54px; height: 54px; margin: 0 auto 1rem auto; border-radius: 14px; box-shadow: 0 4px 16px rgba(37, 99, 235, 0.35);">
                    <svg viewBox="0 0 24 24" width="30" height="30" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M4 6C4 3.79086 5.79086 2 8 2H16C18.2091 2 20 3.79086 20 6V15C20 17.2091 18.2091 19 16 19H8C5.79086 19 4 17.2091 4 15V6Z" fill="#FFFFFF"/>
                        <path d="M6 5C6 4.44772 6.44772 4 7 4H17C17.5523 4 18 4.44772 18 5V9H6V5Z" fill="#0F172A"/>
                        <circle cx="8" cy="14" r="1.5" fill="#38BDF8"/>
                        <circle cx="16" cy="14" r="1.5" fill="#38BDF8"/>
                        <path d="M2 22L7 19M22 22L17 19" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
                        <path d="M5 21H19" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round"/>
                    </svg>
                </div>
                <h1 style="font-size: 1.85rem; font-weight: 900; color: var(--text-main); letter-spacing: -0.5px;">
                    <span style="background: var(--gradient-primary); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">AI</span> MetroFlow
                </h1>
                <p style="color: var(--text-muted); font-size: 0.88rem; font-weight: 500; margin-top: 0.35rem;">
                    AI-Powered Metro Crowd Management & Scheduling
                </p>
            </div>

            <form id="login-form">
                <div class="form-group">
                    <label class="form-label" for="username">Username</label>
                    <input type="text" id="username" class="form-input" placeholder="admin or operator" required autocomplete="username">
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" id="password" class="form-input" placeholder="Enter password" required autocomplete="current-password">
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.85rem; margin-top: 0.5rem; font-size: 0.95rem;">
                    Sign In to Console ➔
                </button>
            </form>

            <!-- 1-Click Fast Login for Demonstrations -->
            <div style="margin-top: 1.5rem; display: flex; flex-direction: column; gap: 0.6rem;">
                <button type="button" onclick="quickLogin('admin', 'admin123')" class="btn btn-secondary btn-sm" style="width: 100%; justify-content: center; border-color: #BFDBFE; background: #EFF6FF; color: #1D4ED8;">
                    ⚡ 1-Click Admin Demo Login
                </button>
                <button type="button" onclick="quickLogin('operator', 'operator123')" class="btn btn-secondary btn-sm" style="width: 100%; justify-content: center; border-color: #A7F3D0; background: #ECFDF5; color: #047857;">
                    🕹️ 1-Click Operator Demo Login
                </button>
            </div>

            <div style="margin-top: 1.5rem; padding-top: 1.25rem; border-top: 1px solid var(--border-color); font-size: 0.82rem; color: var(--text-muted); text-align: center;">
                <p style="margin-bottom: 0.5rem;"><strong>Demo Credentials:</strong></p>
                <div style="display: flex; justify-content: space-around;">
                    <span>🛡️ Admin: <code>admin</code> / <code>admin123</code></span>
                    <span>🕹️ Operator: <code>operator</code> / <code>operator123</code></span>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/main.js"></script>
    <script>
        async function quickLogin(username, password) {
            document.getElementById('username').value = username;
            document.getElementById('password').value = password;
            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();
                if (res.ok) {
                    showToast(`Signed in as ${data.user.full_name}!`, 'success');
                    setTimeout(() => window.location.href = '/index.html', 500);
                } else {
                    showToast(data.error || 'Login failed', 'error');
                }
            } catch (err) {
                showToast('Unable to connect to MetroFlow auth service.', 'error');
            }
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            await quickLogin(username, password);
        });
    </script>
</body>
</html>
