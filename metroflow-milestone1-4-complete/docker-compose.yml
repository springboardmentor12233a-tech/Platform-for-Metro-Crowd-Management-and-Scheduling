services:
  postgres:
    image: postgres:16
    container_name: metroflow_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: metroflow
      POSTGRES_USER: metroflow_user
      POSTGRES_PASSWORD: metroflow_password
    ports:
      - "5432:5432"
    volumes:
      - metroflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metroflow_user -d metroflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: metroflow_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://metroflow_user:metroflow_password@postgres:5432/metroflow
      SECRET_KEY: metroflow-docker-secret-key
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173
      MAX_IMPORT_ROWS: 30000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000/api
    container_name: metroflow_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  metroflow_pgdata:
