version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: metroflow_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: metroflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  mongodb:
    image: mongo:6.0
    container_name: metroflow_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db

  redis:
    image: redis:7-alpine
    container_name: metroflow_redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: metroflow_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/metroflow
      - MONGO_URI=mongodb://mongodb:27017/metroflow
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=metroflow_super_secret_jwt_key_2026
    depends_on:
      - postgres
      - mongodb
      - redis

volumes:
  pgdata:
  mongodata:
