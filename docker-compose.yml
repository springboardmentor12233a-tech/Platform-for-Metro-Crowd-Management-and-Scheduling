version: '3.8'

services:
  # Relational Database for Structured Records & Users
  postgres:
    image: postgres:15-alpine
    container_name: metroflow_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: metroflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # NoSQL Document Store for Passenger Event Telemetry
  mongodb:
    image: mongo:6.0
    container_name: metroflow_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db

  # High-speed In-Memory Cache for Real-Time Sensor Data & WebSocket Streams
  redis:
    image: redis:7-alpine
    container_name: metroflow_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  # Core AI Platform Application Container (FastAPI Backend + Frontend)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: metroflow_app
    restart: unless-stopped
    ports:
      - "8000:8000"
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/metroflow
      - MONGO_URI=mongodb://mongodb:27017/metroflow
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=metroflow_super_secret_jwt_key_2026
    depends_on:
      - postgres
      - mongodb
      - redis

volumes:
  pgdata:
  mongodata:
