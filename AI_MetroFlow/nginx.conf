server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # API Proxy
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket Proxy
    location /api/crowd/ws {
        proxy_pass http://backend:8000/api/crowd/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }

    # Direct routes proxy
    location /demand {
        proxy_pass http://backend:8000/demand;
    }

    location /delay {
        proxy_pass http://backend:8000/delay;
    }

    location /metrics {
        proxy_pass http://backend:8000/metrics;
    }

    location /generate {
        proxy_pass http://backend:8000/generate;
    }
}
